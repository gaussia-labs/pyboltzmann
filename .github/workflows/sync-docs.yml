name: Sync docs to central repo

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout pyboltzmann
        uses: actions/checkout@v4

      - name: Checkout central docs
        uses: actions/checkout@v4
        with:
          repository: gaussia-labs/docs
          token: ${{ secrets.DOCS_REPO_PAT }}
          path: central-docs

      - name: Read sync manifest
        id: manifest
        run: |
          TARGET_DIR=$(jq -r '.target_dir' docs/docs-sync.json)
          echo "target_dir=${TARGET_DIR}" >> "$GITHUB_OUTPUT"

      - name: Sync documentation files
        run: |
          TARGET_DIR="${{ steps.manifest.outputs.target_dir }}"

          # Clean previous SDK docs
          rm -rf "central-docs/${TARGET_DIR}"
          mkdir -p "central-docs/${TARGET_DIR}"

          # Copy all mdx files preserving directory structure
          cd docs
          find . -name '*.mdx' -not -path './node_modules/*' | while read -r f; do
            dir=$(dirname "$f")
            mkdir -p "../central-docs/${TARGET_DIR}/${dir}"
            cp "$f" "../central-docs/${TARGET_DIR}/$f"
          done

      # The manifest already describes the whole tab, group by group and page by page, and only its
      # target_dir was ever read -- so the navigation was maintained twice, once as a declaration
      # nobody applied and once by hand. That is how the reconciliation guide shipped unreachable.
      - name: Apply the navigation from the manifest
        run: python3 .github/scripts/apply_docs_nav.py docs/docs-sync.json central-docs

      - name: Get short SHA
        id: short-sha
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.DOCS_REPO_PAT }}
          path: central-docs
          branch: docs/sync-boltzmann-sdk-${{ steps.short-sha.outputs.sha }}
          delete-branch: true
          title: "docs(boltzmann): sync SDK docs from pyboltzmann@${{ github.sha }}"
          body: |
            Automated sync of Boltzmann SDK documentation from [pyboltzmann](https://github.com/gaussia-labs/pyboltzmann).

            **Commit**: ${{ github.sha }}
            **Branch**: ${{ github.ref_name }}
            **Triggered by**: ${{ github.actor }}

            ---
            This PR was created automatically by the `sync-docs` workflow.

            The `Boltzmann SDK` tab in `docs.json` is rewritten from the `navigation` block of
            `docs/docs-sync.json` in pyboltzmann; every other tab is left byte-identical. So a
            page that is **added or renamed** needs its path in that manifest, not here — and the
            workflow fails rather than syncing if the manifest and the synced files disagree in
            either direction.
          commit-message: "docs(boltzmann): sync SDK docs from pyboltzmann@${{ github.sha }}"
          labels: |
            documentation
            automated
