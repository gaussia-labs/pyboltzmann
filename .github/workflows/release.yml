name: Release

on:
  push:
    branches: [master, develop]
    paths:
      - 'src/boltzmann/**'
      - 'pyproject.toml'
      - '.github/workflows/release.yml'
  # No path filter, and deliberately wider than the push trigger. A push is filtered because it may
  # cut a release and a docs commit should not; a pull request decides whether to merge at all, and
  # a change to the test suite or the lockfile can break the build as surely as one to src.
  pull_request:
    branches: [master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version the package claims in requires-python and its classifiers. A wheel that
        # says it supports 3.11 and is only ever tested on 3.13 is an untested claim.
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      # The release commit refreshes the lock, so a drifted one means that stopped working. Cheap
      # to assert and otherwise only noticed by whoever next runs uv and finds a dirty tree.
      - name: Lockfile is current
        run: uv lock --check

      - name: Lint
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Type check
        run: uv run --python ${{ matrix.python-version }} mypy src/boltzmann

      - name: Test
        run: uv run --python ${{ matrix.python-version }} pytest -m "not slow"

  # The corpus is published elsewhere and vendored here. Without this job the copy would drift, and
  # "conforming" would quietly go back to meaning "matches pyboltzmann" -- which is the thing moving
  # the corpus out was meant to end.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the published corpus
        uses: actions/checkout@v4
        with:
          repository: gaussia-labs/boltzmann-conformance
          path: corpus

      - name: The vendored copy names the version it was taken from
        run: |
          pinned=$(grep -oE '^CORPUS_VERSION = "[^"]+"' src/boltzmann/conformance/golden.py | cut -d'"' -f2)
          published=$(cat corpus/CORPUS_VERSION)
          echo "vendored: $pinned   published: $published"
          if [ "$pinned" != "$published" ]; then
            echo "::error::the vendored corpus is pinned at $pinned and $published is published." \
                 "Re-vendor, or pin deliberately and say why."
            exit 1
          fi

      - name: The vendored files are the published files
        run: |
          diff -r corpus/vectors src/boltzmann/conformance/vectors --exclude='__init__.py' --exclude='__pycache__'
          diff corpus/registry/schemas.json src/boltzmann/conformance/registry/schemas.json

  release:
    needs: test
    # A pull request runs the tests and stops there. Releasing from one would tag and publish a
    # merge that has not happened, from a ref that disappears when it does.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      id-token: write
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install python-semantic-release
        run: |
          uv venv --seed /tmp/psr
          uv pip install --python /tmp/psr/bin/python \
            "python-semantic-release==9.21.2" "gitpython==3.1.59"

      - name: Python Semantic Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_COMMIT_AUTHOR: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        run: |
          # Use GitHub's canonical Actions bot identity so release commits link to the bot account
          # instead of the unrelated generic `actions-user` profile.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export PATH="/tmp/psr/bin:$PATH"
          semantic-release -v version

      # Trusted publishing: PyPI verifies the OIDC token this job mints against the
      # publisher registered for the project, so there is no API token to store, leak
      # or rotate. That is what `id-token: write` above is for, and why this step
      # passes no credentials at all.
      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish to GitHub Releases
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: /tmp/psr/bin/semantic-release -v publish --tag "${{ steps.release.outputs.tag }}"

  # A release on master writes a chore(release) commit that only master has. semantic-release reads
  # the current version from the branch it runs on, so until develop is told, its next release is
  # computed from a version that is no longer the highest one published -- which is how v0.3.0-b.1
  # came to sit below v0.3.0 on PyPI while containing strictly more.
  #
  # Opening a pull request rather than pushing the merge, because the conflict is not incidental: a
  # release rewrites the same three files on both branches, every time, so an automatic merge would
  # fail on every release and teach everyone to ignore it. A PR makes the step impossible to forget
  # while leaving the resolution to someone who can read the changelog.
  back-merge:
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open the back-merge pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --quiet origin master develop

          if git merge-base --is-ancestor origin/master origin/develop; then
            echo "develop already contains master; nothing to back-merge."
            exit 0
          fi

          existing=$(gh pr list --base develop --head master --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #${existing} is already open for this."
            exit 0
          fi

          # Reported, not resolved. Which side wins depends on what was released, and the changelog
          # needs both sides kept in the order the releases were tagged -- neither is a merge driver.
          if git merge-tree --write-tree origin/develop origin/master >/dev/null 2>&1; then
            echo "This merges cleanly." > body.md
          else
            cat > body.md <<'CONFLICTS'
          Expect conflicts in the release artifacts: `CHANGELOG.md`, `pyproject.toml`,
          `src/boltzmann/__init__.py`.

          Take **master's** number in `pyproject.toml` and `__init__.py`. It is the higher,
          already-published one, and moving the version backwards is precisely what makes the next
          release collide. Keep both `CHANGELOG.md` sections, ordered by the date each was tagged.
          CONFLICTS
          fi

          {
            echo "Opened automatically after a release on \`master\`."
            echo
            echo "Without it, \`develop\` computes its next version from a release commit it never"
            echo "received, and publishes a prerelease that sorts *below* a version already on PyPI"
            echo "while containing strictly more than it."
            echo
            cat body.md
          } > pr-body.md

          gh pr create --base develop --head master \
            --title "chore: back-merge ${TAG:-the latest release} into develop" \
            --body-file pr-body.md
